version: '3.7'

services:
  web:
    image: php:apache
    container_name: php-apache
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    volumes:
      - ./services/backend/html:/var/www/html
      - ./services/backend/php.ini:/usr/local/etc/php/conf.d/php.ini
    ports:
      - "80:80"
    depends_on:
      - db
    networks:
      - mynetwork
  ui:
    build:
      context: ./services/frontend
    volumes:
      - ./services/frontend/content:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web
    networks:
     - mynetwork
  db:
    image: mysql:5.7
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  db_data:
